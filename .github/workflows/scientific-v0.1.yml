name: Engineered-World v0.1 Scientific Execution

on:
  push:
    branches: [main]
    paths:
      - world.py
      - data.py
      - model.py
      - experiment.py
      - .github/workflows/scientific-v0.1.yml

permissions:
  contents: read

jobs:
  scientific-v0-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout execution commit
        uses: actions/checkout@v4

      - name: Verify frozen runtime source identity
        shell: bash
        run: |
          echo "17f7fa7172a1e0927ab9b93df1abcc7fdb3fc23b1838cf480fc1afa5509308cb  world.py" | sha256sum -c -
          echo "2e10e6671f97da8b66ad8bfb16c3a52bb78c9f20d87d396566f655d25f6c8b8b  data.py" | sha256sum -c -
          echo "2e3447b192c0c88e15012a8dfbfdc44eff5ba789302e090ce2fedcaefe67d674  model.py" | sha256sum -c -
          echo "0519121e3b1ae218d7105b14cb51355f60aa7babdbf0989488644a09a0d9937f  experiment.py" | sha256sum -c -

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip

      - name: Install frozen runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 torch==2.10.0
          python - <<'PY'
          import sys, numpy, torch
          print('python', sys.version)
          print('numpy', numpy.__version__)
          print('torch', torch.__version__)
          assert sys.version_info[:3] == (3, 13, 5)
          assert numpy.__version__ == '2.3.5'
          assert torch.__version__.split('+')[0] == '2.10.0'
          PY

      - name: Compile exact frozen runtime
        run: python -m py_compile world.py data.py model.py experiment.py

      - name: Run frozen 80x80 scientific assay
        run: |
          python experiment.py --n-models 80 --out results.json
          sha256sum results.json | tee results.sha256

      - name: Upload scientific result custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineered-world-v0.1-scientific-result
          path: |
            results.json
            results.sha256
          if-no-files-found: warn
          retention-days: 90
